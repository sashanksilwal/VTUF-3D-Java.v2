# Tree Configuration File - Small Olive Tree
# This file defines parameters for a small olive tree configuration
# Similar to example directory 2 in PrestonBase8

# Tree identification
treeTypeName=Olive Tree (Small)
speciesName=O.europaea
title=Single olive tree in 5x5 metre plot.
configTypeId=1

# Physical dimensions (meters)
crownHeight=3.75
trunkHeight=1.25
crownRadiusX=2.5
crownRadiusY=2.5
stemDiameter=0.05

# Plot dimensions (meters)
plotXMax=5.0
plotYMax=5.0
treeXPosition=2.5
treeYPosition=2.5

# Aerodynamic parameters (meters)
# zht = height of wind speed measurements
# zpd = zero plane displacement (typically 2/3 of crown height)
# z0ht = roughness length (typically 1/10 of crown height)
zht=40.0
zpd=2.5
z0ht=0.375

# Physiological parameters
leafAreaIndex=2.48
g0=0.03
g1=2.615
